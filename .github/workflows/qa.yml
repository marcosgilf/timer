name: QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEPLOY_CONTEXT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types, lint and format
        run: pnpm check

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 pnpm test:coverage | tee coverage-output.txt
          {
            echo "## Coverage"
            echo
            echo '```text'
            awk '
              /^ % Coverage report/ { printing=1; next }
              /^=============================== Coverage summary/ { exit }
              printing { print }
            ' coverage-output.txt
            echo '```'
            echo
            echo '```text'
            awk '/^=============================== Coverage summary/ { printing=1 } printing { print }' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency patch drift
        run: pnpm check:dependencies

      - name: Security audit
        run: pnpm check:audit

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
