name: CI

# Thin orchestrator: owns the triggers and the order, nothing else.
# The work lives in qa.yml / deploy-dev.yml / deploy-prod.yml, called as reusable workflows so
# `needs:` still gates them and the pull-request context (PR number, comments) is preserved.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: ./.github/workflows/qa.yml

  deploy-dev:
    needs: qa
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-dev.yml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  deploy-prod:
    needs: qa
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
