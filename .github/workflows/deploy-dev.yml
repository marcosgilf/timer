name: Deploy dev

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-dev:
    # Forks cannot read the Netlify credentials, so there is nothing to deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy preview to Netlify
        id: netlify
        run: |
          url=$(npx netlify-cli deploy \
            --dir=dist \
            --no-build \
            --alias="pr-${{ github.event.number }}" \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --json | jq -r '.deploy_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

      - name: Comment the preview URL
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: netlify-preview
          message: |
            🚀 Preview deploy: ${{ steps.netlify.outputs.url }}
